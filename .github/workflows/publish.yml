name: Publish to npm

on:
  push:
    tags: ['v*']
  # Manual runs exercise the release checks without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jdlar1/siigo-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Verify release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { PACKAGE_VERSION } from './dist/version.js';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(name, '@jdlar/siigo-mcp');
          assert.equal(version, PACKAGE_VERSION, 'Package and server versions must match');
          assert.match(version, /^\d+\.\d+\.\d+$/, 'This workflow publishes stable releases only');
          if (process.env.GITHUB_EVENT_NAME === 'push') {
            assert.equal(process.env.GITHUB_REF, `refs/tags/v${version}`, 'Tag must match package version');
          }
          JS
      - name: Pack and inspect the tested package
        id: pack
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/package-manifest.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [packed] = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'package-manifest.json'), 'utf8'));
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(packed.version, manifest.version);
          const paths = new Set(packed.files.map(file => file.path));
          for (const entry of Object.values(manifest.exports)) {
            for (const path of typeof entry === 'string' ? [entry] : Object.values(entry)) {
              assert(paths.has(path.replace(/^\.\//, '')), `Missing package export: ${path}`);
            }
          }
          assert(paths.has(manifest.bin['siigo-mcp']), 'Missing CLI executable');
          assert(!paths.has('.env'), 'Local credentials must not be packed');
          console.log(JSON.stringify(packed, null, 2));
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${join(process.env.RUNNER_TEMP, packed.filename)}\n`);
          JS
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        # --force skips the already-published version check only in this dry run.
        run: npm publish "$TARBALL" --access public --dry-run --force --ignore-scripts
      - name: Publish with npm trusted publishing
        if: github.event_name == 'push'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --provenance --ignore-scripts
